glidar_slam:
  ros__parameters:

    # Coordinate Frame Parameters
    odom_frame: odom
    map_frame: map
    scan_frame: laser
    camera_frame: camera
    base_frame: base_link
    
    # ROS Topic Parameters
    scan_topic: /scan
    tf_topic: /tf
    odom_topic: /odometry/filtered
    csm_debug_low_topic: glidar_slam/debug/csm_likelihood_low
    csm_debug_high_topic: glidar_slam/debug/csm_likelihood_high
    color_image_topic: /camera/color/image_raw
    aligned_depth_image_topic: /camera/aligned_depth/image_raw
    color_camera_info_topic: /camera/color/camera_info

    # Odometry Covariance Override
    # [x, y, z, roll, pitch, yaw]
    odom_covariance_diagonal: [0.1, 0.1, 1.0e-6, 1.0e-6, 1.0e-6, 0.05]

    # General Parameters
    minimum_travel_distance: 0.4
    minimum_travel_heading: 0.4
    # Timing diagnostics for the SLAM pipeline and loop-closure worker.
    debug_timings: false

    # Occupancy Grid Parameters
    occ_map_resolution: 0.05
    occ_map_padding: 2

    # Submap Parameters
    submap_window_size: 5

    # Ground Observation Parameters
    ground_debug_enable: true
    ground_debug_cloud_topic: glidar_slam/debug/ground_inliers
    ground_debug_marker_topic: glidar_slam/debug/ground_plane
    ground_debug_image_topic: glidar_slam/debug/ground_overlay
    ground_debug_plane_size: 4.0
    ground_optimization_enable: true
    ground_observation_max_age_sec: 0.1
    ground_minimum_inlier_count: 100
    ground_normal_sigma: 0.02
    ground_distance_sigma: 0.02
    # Weak roll/pitch/Z constraint used only when no valid plane observation is available.
    ground_fallback_variance: 1.0
    # [left, right, top, bottom] fractions omitted before RGB-D ground extraction.
    ground_roi_ratios: "0.0 0.0 0.2 0.4"

    ground_extraction_pixel_stride: 2
    ground_extraction_voxel_size: 0.02
    # The max 
    ground_extraction_max_distance: 3.0
    # Distance threshold to declare inlies during ground plane fitting. 
    # The method uses the MSCA method which is more robust against noise, so this value can be relatively large
    ground_extraction_distance_threshold: 0.1
    ground_mapping_enable_texture_mapping: true
    ground_mapping_enable_ground_marking_mapping: true
    ground_marking_map_topic: ground_markings_map
    ground_texture_map_topic: ground_texture_map
    ground_texture_coverage_topic: ground_texture_coverage
    ground_map_resolution: 0.02
    ground_map_padding: 2
    # Adaptive-threshold pixels at or above this value are treated as white markings.
    ground_marking_white_threshold: 200
    ground_matching_enable: false
    ground_matching_minimum_marking_count: 20
    ground_matching_minimum_score: 0.5
    ground_matching_min_forward_distance: 0.0
    ground_matching_max_forward_distance: 2.0
    ground_matching_csm_smear_deviation: 0.1
    ground_matching_debug_enable: false
    ground_matching_debug_topic: glidar_slam/debug/ground_matching

    #### Loop Closure Parameters
    loop_debug_enable: false
    loop_input_queue_capacity: 5
    loop_output_queue_capacity: 8
    # minimum number of keyframes between query and candidate keyframes to be considered for loop closure
    loop_minimum_key_separation: 40
    # max euclidean distance between query and candidate keyframes to be considered for loop closure
    loop_maximum_distance: 2.0
    # max heading difference between query and candidate keyframes to be considered for loop closure
    loop_maximum_yaw_difference: 1.0
    # A measure of how many standard deviations are allowed to be in between
    # the relative pose between the query and candidate keyframes 
    # and the expected relative pose.
    loop_mahalanobis_threshold: 2.0
    # noise floor for loop closure proposals to guarantee invertible matrices 
    loop_minimum_xy_variance: 0.01
    # minimum score for a loop closure proposal to be considered valid
    loop_minimum_score: 0.5
    # maximum consistency 
    loop_maximum_consistency_error: 0.5
    
    #### Correlative Scan Matcher Parameters
    csm_debug_enable: false
    csm_smear_deviation: 0.1
    # Uses a linear-time Euclidean distance transform instead of point-wise Gaussian splatting.
    csm_use_distance_transform: false
    # Uses TBB for parallel candidate evaluation when TBB is available at build time.
    csm_use_tbb: true
    # Additional penalties that are being applied to the CSM score by the current deviation from the initial guess
    # This is a strategy to solve the long corridor problem by trusting the odometry induced guess more than the matcher
    # They represent the standard deviation of a Gaussian that is applied to the CSM score based on the distance and angle from the initial guess.
    # The actual penalty is computed as 1 - 0.2 * (delta^2 / std_dev^2), which acts as a flattened first order approximation of a Gaussian kernel
    # One must consider that this artifically inflates the covariance of the CSM result, so it should be used with care.
    csm_use_penalty: false
    csm_distance_penalty_std_dev: 0.5
    csm_angle_penalty_std_dev: 0.5

    #### Cascading CSM stages. Windows denote the width of the area around the previous stage result
    # Search resolutions [m] for each stage
    csm_stage_resolutions: [0.05, 0.02, 0.01]

    # Search window widths [m] for each stage
    csm_stage_translation_steps: [0.1, 0.01, 0.001]
    csm_stage_window_x: [1.0, 0.15, 0.015]
    csm_stage_window_y: [1.0, 0.15, 0.015]

    # Search window widths [rad] for each stage
    csm_stage_angular_steps: [0.1, 0.01, 0.001]
    csm_stage_window_yaw: [1.0, 0.15, 0.015]

    # iSAM 2 Parameters
    isam_relinearizeThreshold: 0.1
    isam_relinearizeSkip: 10
