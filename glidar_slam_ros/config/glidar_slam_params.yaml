glidar_slam:
  ros__parameters:

    # Coordinate Frame Parameters
    odom_frame: odom
    map_frame: map
    scan_frame: laser
    camera_frame: camera
    base_frame: base_link
    
    # ROS Topic Parameters (Publishers)
    scan_topic: /scan
    tf_topic: /tf
    odom_topic: /odom

    # ROS Topic Parameters (Subscribers)
    color_image_topic: /camera/color/image_raw
    aligned_depth_image_topic: /camera/aligned_depth/image_raw
    color_camera_info_topic: /camera/color/camera_info

    # Synchronization Parameter
    approx_sync_max_interval: 0.1

    # Odometry Covariance Override
    # [x, y, z, roll, pitch, yaw]
    odom_covariance_diagonal: [0.1, 0.1, 1.0e-6, 1.0e-6, 1.0e-6, 0.05]

    # General Parameters
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.4
    unobservable_variance: 10000.0
    submap_window_size: 10

    # Startup Parameters
    startup:
      mode: "mapping" # "mapping" or "localization"
      map_load_path: ""
      initial_pose:
        use_provided: true
        pose: [0.0, 0.0, 0.0] # [x, y, yaw]

    # Localization Parameters
    localization_minimum_score: 0.5

    ##### DEBUGGING #####
    # Visualize covariance ellipses for all keyframes instead of only the newest keyframe.
    debug_visualize_covariances: false
    # Timing diagnostics for the SLAM pipeline and loop-closure worker.
    debug_timings: false
    # Debugging for the ground plane extraction and factor
    ground_debug_enable: false
    # Debugging for the ground plane matching
    ground_matching_debug_enable: false
    # Debugging for the loop closure detection
    loop_debug_enable: false

    ##### SCAN PREPROCESSING #####
    scan:
      # Whether the scan is voxelized before use.
      # Avoids overweighting dense points that are in close proximity to the sensor, and reduces the number of points used in scan matching.
      voxelization_enable: false
      # The size of the voxelization grid used to downsample the scan
      voxelization_size: 0.05
      # Whether the scan is densified by linearly interpolating between points by scan_voxelization_size
      # In junction with scan_voxelization_enable, this can be used to create a uniformly spaced point cloud
      densification_enable: false

    ##### MAPPING #####
    # Occupancy Grid Parameters
    mapping:
      occupancy:
        resolution: 0.04
      ground:
        resolution: 0.02
        enable_texture_mapping: true
        enable_ground_marking_mapping: true
      threshold: 200
      prob_hit: 0.7
      prob_miss: 0.4
      prob_cap_min: 0.1192
      prob_cap_max: 0.971

    #### GROUND FACTOR ####
    # Ground Observation Parameters
    ground_optimization_enable: true
    # Standard deviation of the ground plane normal and distance measurements. These values are used to set the covariance of the ground plane observation
    ground_normal_sigma: 0.02
    ground_distance_sigma: 0.02

    ##### GROUND EXTRACTION #####
    # [left, right, top, bottom] fractions omitted before RGB-D ground extraction.
    ground_roi_ratios: "0.0 0.0 0.2 0.4"
    ground_extraction_pixel_stride: 8
    ground_extraction_voxel_size: 0.1
    # The max 
    ground_extraction_max_distance: 4.0
    # Distance threshold to declare inlies during ground plane fitting. 
    # The method uses the MSCA method which is more robust against noise, so this value can be relatively large
    ground_extraction_distance_threshold: 0.1
    ground_extraction_adaptive_threshold_block_size: 101
    ground_extraction_adaptive_threshold_C: -80.0
  
    ##### GROUND MATCHING #####
    # Ground matching settings
    ground_matching_enable: false
    ground_matching_minimum_score: 0.5
    ground_matching_max_distance: 5.0

    ##### LOOP CLOSURE #####
    #### Loop Closure Parameters
    # minimum number of keyframes between query and candidate keyframes to be considered for loop closure
    loop_minimum_key_separation: 15
    # max heading difference between query and candidate keyframes to be considered for loop closure
    loop_maximum_yaw_difference: 1.0
    # A measure of how many standard deviations are allowed to be in between
    # the relative pose between the query and candidate keyframes 
    # and the expected relative pose.
    loop_mahalanobis_threshold: 2.0
    # minimum score for a loop closure proposal to be considered valid
    loop_minimum_score: 0.8
    
    #### Dynamically loaded scan matcher plugins
    csm_local_tracker:
      plugin: glidar_slam/CorrelativeScanMatcherPlugin
      csm_smear_deviation: 0.15
      csm_use_laplace_kernel: true
      csm_use_distance_transform: false
      csm_use_tbb: true
      csm_debug_enable: false
      csm_stage_resolutions: [0.05, 0.04, 0.02]
      csm_stage_translation_steps: [0.1, 0.01, 0.001]
      csm_stage_window_x: [2.0, 0.15, 0.015]
      csm_stage_window_y: [2.0, 0.15, 0.015]
      csm_stage_angular_steps: [0.1, 0.01, 0.001]
      csm_stage_window_yaw: [0.5, 0.15, 0.015]

    csm_ground_marking_detection:
      plugin: glidar_slam/CorrelativeScanMatcherPlugin
      csm_smear_deviation: 0.15
      csm_use_laplace_kernel: true
      csm_use_distance_transform: false
      csm_use_tbb: true
      csm_debug_enable: false
      csm_stage_resolutions: [0.05, 0.05, 0.02]
      csm_stage_translation_steps: [0.1, 0.01, 0.001]
      csm_stage_window_x: [1.0, 0.15, 0.015]
      csm_stage_window_y: [1.0, 0.15, 0.015]
      csm_stage_angular_steps: [0.1, 0.01, 0.001]
      csm_stage_window_yaw: [0.5, 0.15, 0.015]

    csm_loop_closure_detection:
      plugin: glidar_slam/CorrelativeScanMatcherPlugin
      csm_smear_deviation: 0.15
      csm_use_laplace_kernel: true
      csm_use_distance_transform: false
      csm_use_tbb: true
      csm_debug_enable: false
      csm_stage_resolutions: [0.05, 0.04, 0.02]
      csm_stage_translation_steps: [0.1, 0.01, 0.001]
      csm_stage_window_x: [3.0, 0.15, 0.015]
      csm_stage_window_y: [3.0, 0.15, 0.015]
      csm_stage_angular_steps: [0.1, 0.01, 0.001]
      csm_stage_window_yaw: [0.8, 0.15, 0.015]

    # iSAM 2 Parameters
    isam_relinearizeThreshold: 0.1
    isam_relinearizeSkip: 10
